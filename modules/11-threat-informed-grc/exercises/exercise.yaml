id: lab-11
module: 11-threat-informed-grc
title: The control that mitigated nothing
owner: Justin Pagano
volatility: B
review_due: 2026-11-28
engine: builder
claim_thread: laptop-encryption
payload_budget_bytes: 0
desktop_recommended: false

seed:
  profile: m11
  home: /home/analyst
  files: []
  path_tools: []

builder:
  surface: workspace
  validator: coverage
  validator_args: [work/coverage-map.csv, work/prioritized-threats.txt, work/controls-in-scope.txt]

intro: |
  You inherit a control library that grew by accretion: every control was added for a
  reason once, and nothing has ever been removed. Your workspace is the lab's working
  directory, staged exactly as `bash setup.sh ./work` leaves it — the team's owned
  top-threat list, the controls actually run, a seed coverage map with honest mitigation
  labels, and the validator. The "Run validator" button IS the lab's
  `bun validate-coverage.ts work/coverage-map.csv …` step: a port of the committed
  validator, CI-verified byte-for-byte against real `bun` runs of that script, and it
  always evaluates your CURRENT files — the failure you start from and the pass you end
  on are both earned, never scripted. Module 00 asked whether one claim (a laptop's disk
  is encrypted) was true; this lab asks the question that decides whether such a control
  deserves to exist at all: which threat does it make less likely or less damaging? One
  honesty note: the validator and this page's checks are structural floors — the verdict
  sentences are yours to mean.

tasks:
  - id: t1
    type: action
    objective: [2]
    instruction: |
      §6 task 1, plus the read every map deserves first. Open the three fixture files
      (tabs above) and, in `work/map-reading.md`, finish the three one-sentence
      definitions: what the threat list IS, what the in-scope control list IS, and what
      one coverage-map row IS. Then read the seed map like an auditor and fill in both
      defect lines BY ID — the prioritized threat no control reaches, and the in-scope
      control no map line touches — before the validator tells you.
    verify:
      - check: file_content_matches
        path: ~/work/map-reading.md
        regex: "^The threat list \\(prioritized-threats\\.txt\\) is: *\\S"
      - check: file_content_matches
        path: ~/work/map-reading.md
        regex: "^The in-scope control list \\(controls-in-scope\\.txt\\) is: *\\S"
      - check: file_content_matches
        path: ~/work/map-reading.md
        regex: "^A coverage-map row \\(coverage-map\\.csv\\) is: *\\S"
      - check: file_content_matches
        path: ~/work/map-reading.md
        regex: "^Coverage gap \\(prioritized threat with no mapped control\\): *T-1486\\b"
      - check: file_content_matches
        path: ~/work/map-reading.md
        regex: "^Zero-threat control \\(in-scope control on no line of the map\\): *CTRL-DLP-AGENT-04\\b"
    hints:
      - nudge: "The gap is visible as an empty cell: one CSV row has nothing after its second comma. The zero-threat control is visible only by ABSENCE — read controls-in-scope.txt, then hunt each ID through the map's control_id column."
      - concept: "§4.4 — the two defects: coverage gaps and zero-threat controls"
      - reveal: "The gap is T-1486 (its row's control_id is empty); the zero-threat control is CTRL-DLP-AGENT-04 (in scope, on no map line). Fill the two defect lines with those IDs and finish the three definitions in your own words."
    explain: |
      You just did by eye what the validator does by set arithmetic: left column minus
      covered threats, right column minus mapped controls. Frameworks are decent at
      catching the first defect because they push you to add; almost nobody looks for
      the second, because no framework ever asks you to remove anything.

  - id: t2
    type: action
    objective: [2, 6]
    instruction: |
      §6 task 2 — run the validator unresolved. Click **Run validator** and read its
      verdict: it must exit non-zero and report BOTH defects by name. Then keep the
      record: copy the complete output — summary line, both FAIL blocks, and the final
      exit line, exactly as the panel shows them — into `work/validation-before.txt`,
      replacing the placeholder (on a real box this is `… > validation-before.txt 2>&1`).
    verify:
      - check: history_contains
        regex: "^validator:coverage work/coverage-map\\.csv work/prioritized-threats\\.txt work/controls-in-scope\\.txt$"
      - check: validator_passes
        exit: 1
        stdout_matches: "threats covered: 4/5"
      - check: file_content_matches
        path: ~/work/validation-before.txt
        regex: "^prioritized threats: 5 \\| in-scope controls: 4 \\| map rows: 6 \\| threats covered: 4/5$"
      - check: file_content_matches
        path: ~/work/validation-before.txt
        regex: "^  - T-1486$"
      - check: file_content_matches
        path: ~/work/validation-before.txt
        regex: "^  - CTRL-DLP-AGENT-04$"
      - check: file_content_matches
        path: ~/work/validation-before.txt
        regex: "^exit: 1$"
    hints:
      - nudge: "The button runs `bun validate-coverage.ts work/coverage-map.csv work/prioritized-threats.txt work/controls-in-scope.txt` against your files as they are right now. The output panel is selectable text — keeping the failing run is the point, not an afterthought."
      - concept: "§4.4 — the validator catches both defects mechanically; the exit code is the verdict"
      - reveal: "Click Run validator (exit 1 — coverage gap T-1486, zero-threat control CTRL-DLP-AGENT-04), then copy all of its output, including the 'exit: 1' line, into work/validation-before.txt in place of the placeholder."
    explain: |
      That failing run is evidence, not embarrassment: it proves the check can
      discriminate. A validator that cannot fail verifies nothing — and the before/after
      pair you are building is the same fail-then-pass discipline every CI gate in this
      curriculum runs on.

  - id: t3
    type: action
    objective: [2]
    instruction: |
      §6 task 3 — close the coverage gap. The team is standing up a backup-and-restore
      program as `CTRL-BACKUP-RESTORE-05` (the next free control ID). Edit
      `work/coverage-map.csv` so the T-1486 row maps to it with an HONEST mitigation
      label — backups do not stop ransomware from encrypting; they shrink what the
      encryption costs you. Add `CTRL-BACKUP-RESTORE-05` on its own line at the end of
      `work/controls-in-scope.txt` (a control on the map but out of scope would itself
      look unmapped from the other side). Then write one sentence after "Label
      rationale:" in `work/map-reading.md` on why your label and not a stronger one.
    verify:
      - check: file_content_matches
        path: ~/work/coverage-map.csv
        regex: "^T-1486,Data encrypted for ransom,CTRL-BACKUP-RESTORE-05,(detects|partial)$"
      - check: file_content_matches
        path: ~/work/controls-in-scope.txt
        regex: "^CTRL-BACKUP-RESTORE-05$"
      - check: file_content_matches
        path: ~/work/map-reading.md
        regex: "^Label rationale \\(task 3 — why this label and not a stronger one\\): *\\S"
    hints:
      - nudge: "§5.1 shows one control carrying two different honest strengths against two threats. Ask what a restore actually changes about a ransomware event: not whether it happens — what it costs."
      - concept: "§4.3 — the mitigation label is an honesty call: prevents / detects / partial, never a silent claim of full mitigation"
      - reveal: "Rewrite the gap row as `T-1486,Data encrypted for ransom,CTRL-BACKUP-RESTORE-05,detects` (or `partial`), append `CTRL-BACKUP-RESTORE-05` to work/controls-in-scope.txt, and give one sentence: backups detect-and-recover — claiming `prevents` would be the false-confidence defect."
    explain: |
      Note what this page rejected that the validator would have accepted: `prevents` is
      inside the validator's allowed vocabulary, so the mechanical floor would pass it.
      The honesty bar sits above the floor — a map where every line silently claims full
      mitigation is the false-confidence defect industrialized, one dropdown at a time.

  - id: t4
    type: action
    objective: [3]
    instruction: |
      §6 task 4 — the verdict on the zero-threat control. Fill in
      `work/removal-recommendation.md` for `CTRL-DLP-AGENT-04`: what it was ASSUMED to
      mitigate, how many prioritized threats it actually maps to (read your map), what
      it costs to run, and the verdict — `kill`, `downgrade`, or
      `keep-and-fix-threat-list` — with a rationale built from those facts. "We've
      always had it" is a habit, not evidence; this page rejects it. If your verdict is
      keep-and-fix-threat-list, also add the missing threat to
      `work/prioritized-threats.txt` and draw its line in the map — the validator will
      hold you to whichever verdict you choose.
    verify:
      - check: file_content_matches
        path: ~/work/removal-recommendation.md
        regex: "^control_id: *CTRL-DLP-AGENT-04\\b"
      - check: file_content_matches
        path: ~/work/removal-recommendation.md
        regex: "^assumed_to_mitigate: *\\S"
      - check: file_content_matches
        path: ~/work/removal-recommendation.md
        regex: "^maps_to_prioritized_threats: *0\\b"
      - check: file_content_matches
        path: ~/work/removal-recommendation.md
        regex: "^running_cost: *\\S"
      - check: file_content_matches
        path: ~/work/removal-recommendation.md
        regex: "^verdict: *(kill|downgrade|keep-and-fix-threat-list)\\b"
      - check: file_content_matches
        path: ~/work/removal-recommendation.md
        regex: "^rationale: *\\S"
      - check: file_not_matches
        path: ~/work/removal-recommendation.md
        regex: "[Aa]lways (had|been)"
    hints:
      - nudge: "§5.2 is the shape: name the threat it was confused with (which prioritized threat sounds adjacent but lives on a different data path?), quantify the cost, and let the verdict follow. Each of the three verdicts blames a different thing — the control, its tier, or the threat list."
      - concept: "§4.5 — kill, downgrade, or keep-and-fix-threat-list: what a zero-threat control deserves"
      - reveal: "e.g. control_id: CTRL-DLP-AGENT-04 · assumed_to_mitigate: \"data exfiltration generally\" · maps_to_prioritized_threats: 0 · running_cost: endpoint agent on every laptop plus ~3 hrs/wk of false-positive triage · verdict: kill (or downgrade) · rationale: the exfiltration threat we prioritized is T-1530, cloud-storage theft — a data path the endpoint agent never sees; the freed triage hours fund the new T-1486 coverage."
    explain: |
      Recommending a removal is a GRC engineering act, not recklessness — and now it is
      a documented one: assumed threat named, zero mappings shown, cost stated, verdict
      argued. The burden of proof just moved to whoever wants to keep paying for it.

  - id: t5
    type: action
    objective: [6]
    instruction: |
      §6 task 5 — enact the verdict, then make the machine agree. Make the files match
      what you decided: a `kill` (or a downgrade out of the load-bearing tier) means
      deleting the `CTRL-DLP-AGENT-04` line from `work/controls-in-scope.txt`;
      keep-and-fix-threat-list means the new threat and its line are already in place.
      Click **Run validator** and confirm it now exits 0 — every prioritized threat
      covered, no zero-threat controls, all labels valid. Copy the passing output into
      `work/validation-after.txt`, replacing the placeholder.
    verify:
      - check: validator_passes
        exit: 0
        stdout_matches: "^PASS: every prioritized threat has a mapped control; no zero-threat controls; all mitigation labels valid\\."
      - check: file_content_matches
        path: ~/work/validation-after.txt
        regex: "^PASS: every prioritized threat has a mapped control; no zero-threat controls; all mitigation labels valid\\.$"
      - check: file_content_matches
        path: ~/work/validation-after.txt
        regex: "^prioritized threats: [0-9]+ \\|"
    hints:
      - nudge: "Still failing? Its output names the exact leftover defect. The classic: the verdict file says kill but CTRL-DLP-AGENT-04 still sits in controls-in-scope.txt — the validator only believes the files."
      - concept: "§4.4 — \"resolve\" is a file edit the validator can see, not a sentence in a document"
      - reveal: "Delete the CTRL-DLP-AGENT-04 line from work/controls-in-scope.txt, click Run validator (exit 0, threats covered 5/5), then copy the full PASS output into work/validation-after.txt."
    explain: |
      The pass you just captured was computed from your current files — paste-without-fix
      cannot produce it, because the page checks the validator's last real run, not the
      text in your capture file. before exits 1, after exits 0: "kill controls that
      mitigate nothing" just went from opinion to verdict, with the exit code as proof.

  - id: t6
    type: action
    objective: [4]
    instruction: |
      §6 task 6 — interview the customer of a SURVIVING control (one your edited map
      still maps to a prioritized threat — `CTRL-ACCESS-REVIEW-02` is a natural choice,
      not the control you just sentenced). In `work/interview-notes.md`, answer the four
      §4.6 questions concretely — improvise the customer if you must, but make the
      answers specific enough to act on — and finish the Q4 lines naming where the
      control's TRUTH lives versus where its EVIDENCE is gathered today.
    verify:
      - check: file_content_matches
        path: ~/work/interview-notes.md
        regex: "^control: *CTRL-[A-Z0-9-]+"
      - check: file_not_matches
        path: ~/work/interview-notes.md
        regex: "^control: *CTRL-DLP-AGENT-04"
      - check: file_content_matches
        path: ~/work/interview-notes.md
        regex: "^A1: *\\S"
      - check: file_content_matches
        path: ~/work/interview-notes.md
        regex: "^A2: *\\S"
      - check: file_content_matches
        path: ~/work/interview-notes.md
        regex: "^A3: *\\S"
      - check: file_content_matches
        path: ~/work/interview-notes.md
        regex: "^truth_lives_in: *\\S"
      - check: file_content_matches
        path: ~/work/interview-notes.md
        regex: "^evidence_gathered_in: *\\S"
    hints:
      - nudge: "§5.3 is a worked interview. The tell you are listening for: the real decisions already happen in some system, and the evidence is a separate re-typing of what that system already knows."
      - concept: "§4.6 — stakeholder-as-customer: the gap between where truth lives and where evidence is gathered is the design defect"
      - reveal: "For CTRL-ACCESS-REVIEW-02: A1 the engineering lead signs a quarterly spreadsheet+PDF · A2 they already approve every access request in the access tool, timestamped · A3 the whole spreadsheet ritual re-types the tool's truth · truth_lives_in: the access tool's approval log · evidence_gathered_in: a hand-built quarterly spreadsheet and signed PDF."
    explain: |
      The interview located the defect precisely, in the customer's own words: truth in
      a system the work already touches, evidence hand-built somewhere else. That gap is
      why threat-justified controls still rot — the evidence depends on a busy human
      doing extra work that has nothing to do with their real job.

  - id: t7
    type: action
    objective: [5]
    instruction: |
      §6 task 7 — redesign that control so the evidence is a by-product of the work. In
      `work/redesigned-control-flow.md`, fill §5.4's shape: the toil-laden BEFORE (work,
      evidence, failure mode), the AFTER where doing the real work emits the evidence
      automatically, one sentence on why it is cheaper, one on why it is harder to fake,
      and the prioritized threat the control STILL mitigates — a redesigned control must
      still earn its place.
    verify:
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "BEFORE \\(toil-laden\\):\\n  Work: *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "BEFORE \\(toil-laden\\):\\n  Work: [^\\n]*\\n  Evidence: *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "^  Failure: *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "AFTER \\(evidence as by-product\\):\\n  Work: *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "AFTER \\(evidence as by-product\\):\\n  Work: [^\\n]*\\n  Evidence: *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "^  Why better \\(cheaper\\): *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "^  Why better \\(harder to fake\\): *\\S"
      - check: file_content_matches
        path: ~/work/redesigned-control-flow.md
        regex: "^  Still mitigates: *T-[0-9]{4}\\b"
    hints:
      - nudge: "The AFTER's Work line should be nearly identical to the BEFORE's — that is the point. Only the Evidence line changes: from something a human builds to something the work's own system emits."
      - concept: "§4.7 — arrange the control so doing the real work correctly emits the evidence automatically"
      - reveal: "BEFORE: work = lead approves requests in the tool; evidence = separate quarterly spreadsheet+PDF; failure = skipped or back-dated under deadline. AFTER: work unchanged; evidence = a scheduled export of the tool's approval log IS the review record. Cheaper: no separate chore. Harder to fake: a system log can't be back-dated like a spreadsheet. Still mitigates: T-1078."
    explain: |
      Same control, same threat, two improvements at once: cheaper because no one is
      nagged into extra work, harder to fake because no human hand produced the record.
      Threat-informed says which controls survive; this redesign is how survivors get
      built. Together they are the §4.8 portfolio shape the module-15 capstone demands.

  - id: t8
    type: reflection
    objective: [1]
    instruction: |
      The walkthrough, in writing (4–6 sentences, no peeking at §3): explain to a
      framework-checklist colleague why "we have a control for that" and "that control
      reduces a threat we actually face" are different claims, and why only the second
      is defensible — using the control you sentenced as the example. Read two rows of your
      finished map aloud as sentences and justify their mitigation labels. Then close
      the thread you have carried since module 00: which prioritized threat would
      justify the laptop-encryption control from your one-pager, and which honest label
      does it deserve against a stolen-laptop scenario — what does `prevents` overclaim
      the moment a session is left unlocked?
    hints:
      - nudge: "The three answers to \"why does this control exist\": a threat, a citation, a shrug. Your DLP verdict is the worked case of demanding the first kind of answer — and laptop encryption protects data at rest, which is not the same as protecting a logged-in machine."
      - concept: "§3 — The Mental Model: threat, citation, or shrug"

completion:
  evidence_pack: true

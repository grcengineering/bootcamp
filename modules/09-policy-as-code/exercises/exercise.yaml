id: lab-09
module: 09-policy-as-code
title: The verdict is a function
owner: Justin Pagano
volatility: B
review_due: 2026-12-01
engine: shell-linux
payload_budget_bytes: 0
desktop_recommended: false

seed:
  profile: m09
  home: /home/analyst
  files: []
  path_tools: []

intro: |
  You own the control "access changes must never grant the legacy-admin role." In this
  lab you take the verdict out of a human's head and make it executable: the control as
  policy in two languages, a verdict-function a machine can run, a CI gate that blocks
  the bad change, and evidence records that fall out of every run for free. The terminal
  is a real simulation: the scripts you write here genuinely execute, and their outputs
  are CI-verified against a real Linux machine. One honest boundary: the staged reference
  solutions (check.sh, run-policy-gate.sh) use awk features beyond this simulation's
  taught subset — read them any time, but run them on your own machine; the versions you
  author here produce the same verdicts, the same gate lines, and the same records.
  The policy engines themselves (Cedar CLI, OPA) are optional in this lab by design —
  the module's point is that the lab's core logic is engine-agnostic.

walkthrough_first_input: pwd

tasks:
  - id: t1
    type: action
    objective: [1]
    instruction: |
      Provision the lab and meet the inputs. Run `bash labs/setup.sh ./lab09`, enter
      `lab09`, and read both access exports: `access-clean.csv` and
      `access-violation.csv`. They differ by one row — find it. Then look harder at the
      *clean* file: one row mentions `legacy-admin` and is still clean. Why?
    verify:
      - check: history_contains
        regex: '^bash labs/setup\.sh \./lab09$'
      - check: file_exists
        path: ~/lab09/access-violation.csv
      - check: cwd_is
        path: ~/lab09
      - check: history_contains
        regex: '^cat access-clean\.csv$'
      - check: history_contains
        regex: '^cat access-violation\.csv$'
    hints:
      - nudge: "The setup line is in §6 of the module. Each export row is one access change: row, principal, action, resource_role."
      - concept: "§4.1 — a policy is a function: the input is a fact you can fetch, the decision is what a human used to pronounce"
      - reveal: "bash labs/setup.sh ./lab09, then: cd lab09 · cat access-clean.csv · cat access-violation.csv"
    explain: |
      Row 4 of the violating export is carol being GRANTED legacy-admin — the change the
      control forbids. Row 3 of the clean export is dave having legacy-admin REVOKED —
      same role, opposite action, perfectly fine. Hold on to that row: it is the trap
      this whole lab is built around.

  - id: t2
    type: action
    objective: [2]
    instruction: |
      Write the control in two policy languages, in your own files: `my-policy.cedar`
      as a Cedar `forbid` statement, and `my-policy.rego` as a Rego `deny` rule
      (package `access`, `import rego.v1`). The reference `policy.cedar` and
      `policy.rego` are sitting right next to you — author yours first, then compare.
      The checker reads your files, and it knows the reference headers when it sees them.
    verify:
      - check: file_content_matches
        path: ~/lab09/my-policy.cedar
        regex: 'forbid\('
      - check: file_content_matches
        path: ~/lab09/my-policy.cedar
        regex: 'action == Action::"grantRole"'
      - check: file_content_matches
        path: ~/lab09/my-policy.cedar
        regex: 'resource\.role == "legacy-admin"'
      - check: file_not_matches
        path: ~/lab09/my-policy.cedar
        regex: '^// Control AC-6'
      - check: file_content_matches
        path: ~/lab09/my-policy.rego
        regex: 'package access'
      - check: file_content_matches
        path: ~/lab09/my-policy.rego
        regex: 'import rego\.v1'
      - check: file_content_matches
        path: ~/lab09/my-policy.rego
        regex: 'deny contains msg if'
      - check: file_content_matches
        path: ~/lab09/my-policy.rego
        regex: 'input\.action == "grantRole"'
      - check: file_content_matches
        path: ~/lab09/my-policy.rego
        regex: 'input\.resource\.role == "legacy-admin"'
      - check: file_content_matches
        path: ~/lab09/my-policy.rego
        regex: 'msg :='
      - check: file_not_matches
        path: ~/lab09/my-policy.rego
        regex: '^# Control AC-6'
    hints:
      - nudge: "Cedar asks: may this principal do this action on this resource? Rego asks: does this condition hold over this JSON? Same verdict, two question shapes. `nano my-policy.cedar` opens the editor."
      - concept: "§4.2 + §4.3 — Cedar's forbid always wins; Rego's deny collects a message when every clause in the body holds"
      - reveal: 'nano my-policy.cedar — forbid(principal, action == Action::"grantRole", resource) when { resource.role == "legacy-admin" }; — then nano my-policy.rego — package access … import rego.v1 … deny contains msg if { input.action == "grantRole" … input.resource.role == "legacy-admin" … msg := "granting the legacy-admin role is forbidden" }'
    explain: |
      Two files, one verdict. Cedar made you name a principal, an action, and a resource
      whether you wanted to or not; Rego let you write any condition over any JSON shape
      and enforced nothing. That difference is not cosmetic — it is the next reflection.

  - id: t3
    type: reflection
    objective: [2]
    instruction: |
      One sentence each, as you would say it to a colleague: what did Cedar force you to
      specify that Rego didn't? And what did Rego let you do that Cedar's grammar can't
      even describe? (If you compared your files against the references, say whether the
      languages — not the answers — pushed you to think differently.)
    hints:
      - nudge: "Cedar's grammar IS the principal/action/resource model. Rego's freedom is that `input` can be any JSON — a pod spec, a config, a CSV row."
      - concept: "§5.1 — the language shapes the question; pick the language whose shape matches the control"

  - id: t4
    type: action
    objective: [1, 3]
    instruction: |
      Make the verdict executable. Write `my-check.sh`: it takes an access export as
      `$1`, prints one `DENY` line per violating row, prints a `RESULT` line, and exits
      `1` if and only if there is at least one violation (`0` clean, `2` usage error).
      The trap from t1 is live here: a row violates ONLY when the action is `grantRole`
      AND the role is `legacy-admin` — dave's revoke must pass. Make it executable, then
      capture its verdict on the violating export: run it with `> check-violation.out`.
    verify:
      - check: file_exists
        path: ~/lab09/my-check.sh
      - check: file_content_matches
        path: ~/lab09/my-check.sh
        regex: 'grantRole'
      - check: file_content_matches
        path: ~/lab09/my-check.sh
        regex: 'legacy-admin'
      - check: script_reproducible
        path: ~/lab09/my-check.sh
        args: [/home/analyst/lab09/access-clean.csv]
        expect_stdout: "RESULT  control=AC-6-legacy-admin  decision=allow  violations=0"
      - check: file_content_equals
        path: ~/lab09/check-violation.out
        from: generated
      - check: artifact_produced_by
        path: ~/lab09/check-violation.out
        required_commands: [./my-check.sh]
        forbidden_commands: [echo, printf, tee, nano]
    hints:
      - nudge: "Both columns, one condition. A check that fires on `legacy-admin` alone will deny dave's REVOKE in the clean export — green-looking, silently wrong. awk can test `$3` and `$4` together; grep -c can count rows matching the full `,grantRole,legacy-admin` tail."
      - concept: "§4.1 + §4.3 — decision = policy(input), and the easiest way to be wrong is to encode half the condition"
      - reveal: 'nano my-check.sh — guard $1 (usage to stderr, exit 2 when empty or missing), print violations with awk -F, the pattern NR == 1 skips the header and $3 == "grantRole" && $4 == "legacy-admin" prints "DENY  row " $1 ": " $2 " -> " $4 "  (forbidden by AC-6)", count with COUNT=$(grep -c invocation on the ,grantRole,legacy-admin$ tail), then RESULT  control=AC-6-legacy-admin  decision=deny  violations=$COUNT with exit 1 when the count is above zero, else the allow line with violations=0 and exit 0 — then chmod +x my-check.sh and ./my-check.sh access-violation.csv > check-violation.out'
    explain: |
      The checker just re-ran your script twice in a clean environment — with the clock
      and entropy deliberately perturbed between runs — and against the clean export it
      had to say `allow` both times. That clean export contains dave's legacy-admin
      revoke, so passing this check means your verdict reads BOTH columns. The §4.1
      function is now a real program with a real exit code.

  - id: t5
    type: action
    objective: [3]
    instruction: |
      Read the verdict the way a CI system will: by exit code, not by output. Run
      `./my-check.sh access-clean.csv` and then `echo $?`. Run
      `./my-check.sh access-violation.csv` and `echo $?` again. Two runs, two numbers —
      those numbers are the entire interface between your judgment and the pipeline.
    verify:
      - check: history_contains
        regex: '^\./my-check\.sh access-clean\.csv$'
      - check: history_contains
        regex: '^\./my-check\.sh access-violation\.csv$'
      - check: history_contains
        regex: '^echo \$\?$'
    hints:
      - nudge: "`$?` holds the previous command's exit code. Predict both numbers before you look."
      - concept: "§4.5 — output is for people; the exit code is what fails the build"
      - reveal: "./my-check.sh access-clean.csv, then echo $? — repeat with access-violation.csv: the clean run reports 0, the violating run reports 1, a usage mistake reports 2"
    explain: |
      `0` and `1`. Nothing about that pair is decorative: CI systems treat non-zero as
      "fail the build," so `exit 1` on a violation is the exact mechanism by which a
      non-compliant change physically cannot merge. That is what gives the gate teeth.

  - id: t6
    type: action
    objective: [3, 4]
    instruction: |
      Build the gate a pipeline would call. Write `my-gate.sh` taking the export (`$1`)
      and an evidence-store directory (`$2`): it announces the evaluation (`EVAL` line),
      runs `./my-check.sh` on the input, and — on EVERY run, regardless of verdict —
      writes one JSON evidence record named
      `<store>/AC-6-legacy-admin-<run-id>-<timestamp-digits>.json` carrying all eight
      fields: control_id, policy_engine, decision, passed, violations, input_ref,
      evaluated_at, run. Honor `GATE_FAKE_TIME` (timestamp) and `CI_RUN_ID` (run id) so
      runs are reproducible, echo `EVIDENCE` and `GATE` lines, and exit with the
      check's code. Then simulate the CI run on the violating input:
      `GATE_FAKE_TIME=2026-05-28T17:04:00Z CI_RUN_ID=ci-1789 ./my-gate.sh access-violation.csv evidence-store`
    verify:
      - check: file_exists
        path: ~/lab09/my-gate.sh
      - check: file_content_matches
        path: ~/lab09/my-gate.sh
        regex: 'my-check\.sh'
      - check: history_contains
        regex: '^GATE_FAKE_TIME=2026-05-28T17:04:00Z CI_RUN_ID=ci-1789 \./my-gate\.sh access-violation\.csv evidence-store$'
      - check: file_exists
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-1789-20260528170400.json
      - check: file_content_equals
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-1789-20260528170400.json
        from: generated
      - check: artifact_produced_by
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-1789-20260528170400.json
        forbidden_commands: [echo, printf, tee, cat, nano]
    hints:
      - nudge: "The gate is a wrapper: run the check, capture CODE=$? immediately, map 0 to allow/true/PASS and 1 to deny/false/FAIL, write the record, exit with CODE. The timestamp digits for the filename are the GATE_FAKE_TIME with its punctuation deleted."
      - concept: "§4.6 — the gate already computed a verdict, so capture it: proof as a by-product, not a separate chore"
      - reveal: 'nano my-gate.sh — guard $1 and $2 (usage + exit 2), mkdir -p the store, RUN_ID from CI_RUN_ID, NOW from GATE_FAKE_TIME (fall back to date -u only if unset), echo the EVAL line, run ./my-check.sh on the input and capture CODE=$?, branch 0 to allow/true/PASS else deny/false/FAIL, recount with grep -c, STAMP=$(echo the NOW value | tr -d the TZ:- characters), write the one-line JSON record with > into evidence-store/AC-6-legacy-admin-$RUN_ID-$STAMP.json, echo the EVIDENCE and GATE lines, exit with CODE — then chmod +x my-gate.sh and GATE_FAKE_TIME=2026-05-28T17:04:00Z CI_RUN_ID=ci-1789 ./my-gate.sh access-violation.csv evidence-store'
    explain: |
      The gate failed (exit 1), the bad change is blocked — and the proof wrote itself:
      a passed:false record with the §4.6 shape, produced by the run, not by you. The
      checker verified the record's provenance: it had to fall out of your gate
      executing, not out of an echo. One declared divergence from §5.3's worked example:
      your input_ref is the input filename rather than a cksum-derived hash — the record
      SHAPE is the contract, and the reference's hash trick needs awk features this
      simulation honestly doesn't carry.

  - id: t7
    type: action
    objective: [4]
    instruction: |
      Now the passing half of the audit trail. Run the gate on the clean input as a
      later CI run:
      `GATE_FAKE_TIME=2026-05-28T17:22:00Z CI_RUN_ID=ci-1804 ./my-gate.sh access-clean.csv evidence-store`
      Then inspect the store: `ls evidence-store` and `cat` the ci-1804 record. Two
      runs, two records — one passed:false, one passed:true — written by the gate.
    verify:
      - check: history_contains
        regex: '^GATE_FAKE_TIME=2026-05-28T17:22:00Z CI_RUN_ID=ci-1804 \./my-gate\.sh access-clean\.csv evidence-store$'
      - check: file_exists
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-1804-20260528172200.json
      - check: file_content_equals
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-1804-20260528172200.json
        from: generated
      - check: artifact_produced_by
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-1804-20260528172200.json
        forbidden_commands: [echo, printf, tee, cat, nano]
      - check: history_contains
        regex: '^ls evidence-store/?$'
      - check: history_contains
        regex: '^cat evidence-store/AC-6-legacy-admin-ci-1804-20260528172200\.json$'
    hints:
      - nudge: "Same gate, different input, different run id and timestamp — the store accumulates one record per evaluation, pass or fail."
      - concept: "§5.3 — two commits, two records, a complete before/after audit trail produced by the act of judging"
      - reveal: "GATE_FAKE_TIME=2026-05-28T17:22:00Z CI_RUN_ID=ci-1804 ./my-gate.sh access-clean.csv evidence-store, then ls evidence-store and cat evidence-store/AC-6-legacy-admin-ci-1804-20260528172200.json"
    explain: |
      An auditor asking "prove this control was enforced on every change" now gets a
      directory listing, not a scramble: deny/passed:false at 17:04, allow/passed:true
      at 17:22, each naming its input, engine, and run. EVIDENCE and MONITOR just fell
      out of EVALUATE at zero marginal toil.

  - id: t8
    type: action
    objective: [1, 3]
    instruction: |
      Prove the gate judges the change, not the text. First flip the verdict to PASS:
      build `access-tampered.csv` from the violating export with carol's row turned
      into a REVOKE (keep the other rows: `grep -v` the forbidden row into the new
      file, then append the revoke row with `>>`). Gate it with run id `ci-tamper` and
      time `2026-05-28T18:00:00Z` — predict the result before you run it. Then flip the
      other way: copy the clean export to `access-injected.csv`, append the row
      `5,frank,grantRole,legacy-admin`, and gate it with run id `ci-inject` at
      `2026-05-28T18:05:00Z`.
    verify:
      - check: file_content_matches
        path: ~/lab09/access-tampered.csv
        regex: '^4,carol,revokeRole,legacy-admin$'
      - check: file_not_matches
        path: ~/lab09/access-tampered.csv
        regex: 'grantRole,legacy-admin'
      - check: history_contains
        regex: '^GATE_FAKE_TIME=2026-05-28T18:00:00Z CI_RUN_ID=ci-tamper \./my-gate\.sh access-tampered\.csv evidence-store$'
      - check: file_content_equals
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-tamper-20260528180000.json
        from: generated
      - check: file_content_matches
        path: ~/lab09/access-injected.csv
        regex: ',grantRole,legacy-admin$'
      - check: file_content_equals
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-inject-20260528180500.json
        from: generated
      - check: history_contains
        regex: '^GATE_FAKE_TIME=2026-05-28T18:05:00Z CI_RUN_ID=ci-inject \./my-gate\.sh access-injected\.csv evidence-store$'
      # Provenance guards appended (not interleaved) so the from:generated check indices
      # above stay stable — each record must fall out of a gate run, never a hand-echo,
      # mirroring the t6/t7 contract (web ISA ISC-126).
      - check: artifact_produced_by
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-tamper-20260528180000.json
        forbidden_commands: [echo, printf, tee, cat, nano]
      - check: artifact_produced_by
        path: ~/lab09/evidence-store/AC-6-legacy-admin-ci-inject-20260528180500.json
        forbidden_commands: [echo, printf, tee, cat, nano]
    hints:
      - nudge: "One word changes — grantRole becomes revokeRole — and the gate must flip FAIL to PASS, because the control forbids the GRANT, not the role. If your gate still fails, your verdict is ignoring the action column."
      - concept: "§4.3 — the difference between a verdict and a pattern-match is exactly this pair of flips"
      - reveal: "grep -v ',grantRole,legacy-admin$' access-violation.csv > access-tampered.csv, then echo '4,carol,revokeRole,legacy-admin' >> access-tampered.csv and GATE_FAKE_TIME=2026-05-28T18:00:00Z CI_RUN_ID=ci-tamper ./my-gate.sh access-tampered.csv evidence-store — for the inverse, cp access-clean.csv access-injected.csv, echo '5,frank,grantRole,legacy-admin' >> access-injected.csv, then GATE_FAKE_TIME=2026-05-28T18:05:00Z CI_RUN_ID=ci-inject ./my-gate.sh access-injected.csv evidence-store"
    explain: |
      FAIL flipped to PASS when the grant became a revoke, and PASS flipped to FAIL when
      a forbidden grant was injected — your verdict bites on the actual change in both
      directions, and the store now holds the records to prove it. A check that can't
      flip is not a control; it's a decoration.

  - id: t9
    type: reflection
    objective: [5]
    instruction: |
      The policy-rot drill. Read the staged fixture: `cat rotted-policy.txt` — a Rego
      rule for control VR-3 that has passed every run for a year. In three or four
      sentences: why is it green-but-meaningless (what does it actually test, and what
      stamps that field)? What ownership gap let it rot? And what is the fix — name the
      structural part, not just "rewrite the rule."
    hints:
      - nudge: "Follow the field: who sets last_reviewed, and on what trigger? Then read the OWNER and REVIEW CADENCE lines."
      - concept: "§4.7 — worse than a noisy broken rule is a quietly meaningless one; the structural fix is ownership, not syntax"

  - id: t10
    type: reflection
    objective: [1, 6]
    instruction: |
      The judgment that outranks the syntax. Two short paragraphs. First: was
      policy-as-code the right tool for the legacy-admin control? Defend the yes using
      §4.8's three tests (objective verdict? high-frequency? ownable?) and name an
      owner and a review cadence. Second: is it the right tool for the rotted VR-3
      risk-acceptance control from t9? Defend the no, name the manual alternative, and
      say in one sentence what your gate's exit code moved out of human hands — and
      what it deliberately left behind.
    hints:
      - nudge: "Yes-cases are objective, high-frequency, and ownable. VR-3 fails the first test: re-justifying a risk acceptance is a human judgment a function would lie about."
      - concept: "§4.8 + §5.4 — choosing NOT to encode a control, in writing, is a senior move, not a failure"

completion:
  evidence_pack: true

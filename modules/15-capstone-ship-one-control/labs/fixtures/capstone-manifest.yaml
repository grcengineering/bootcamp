# Sample capstone manifest (committed fixture).
# Maps each of the seven irreducible-loop stages to the artifact that discharges it,
# plus a pointer to the before/after writeup of the SAME control. The validator
# (validate-capstone.sh, generated by setup.sh) asserts all 7 stages are covered
# and the before/after file is present. This is the curriculum proving its own
# coverage the same way a control proves its own compliance.
control: "S3 buckets block public access (SOC 2 CC6.1)"
owner: "a.engineer@example.com"
loop_coverage:
  UNDERSTAND: control-statement.md
  LOCATE:     control-statement.md
  QUERY:      collect.sh
  EVALUATE:   policy/public_access.rego
  EVIDENCE:   evidence/
  MONITOR:    .github/workflows/ccm.yml
  OWN:        README.md
before_after: before-after.md

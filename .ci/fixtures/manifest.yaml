# reproduce, each with its ground-truth source and match class (root ISA ISC-53).
# Captured fixtures land in .ci/fixtures/captured/<id>.json with provenance.
#
# match classes: byte-exact | structured | engine-pinned | synthesized-porcelain |
#                authored-with-citation | computed
# sources: docker-linux-userland | docker-linux-booted | macos-host | pwsh-authored |
#          wasm-engine | authored

meta:
  version: 1
  epoch: "2026-06-01T09:00:00Z"
  contracts:
    docker-linux-userland:
      dockerfile: env/Dockerfile.userland
      base_digest: "sha256:786a8b558f7be160c6c8c4a54f9a57274f3b4fb1491cf65146521ae77ff1dc54"
      hostname: workstation
      user: analyst
      uid: 1000
      home: /home/analyst
      shell: /bin/bash
      locale: C.UTF-8
      cols: 80
      notes: >
        tty-style columnar output is captured via explicit width flags (e.g. `ls -C -w80`),
        which GNU ls renders byte-identically to a tty at that width — no pty needed,
        stderr separation preserved. Plain (TERM=dumb) output: no color codes anywhere.
    docker-linux-booted:
      dockerfile: env/Dockerfile.booted
      base_digest: "sha256:786a8b558f7be160c6c8c4a54f9a57274f3b4fb1491cf65146521ae77ff1dc54"
      hostname: web-01
      user: grcops
      uid: 1001
      home: /home/grcops
      shell: /bin/bash
      locale: C.UTF-8
      cols: 80
      password: labpass         # scenario constant baked into the image (sudo/ssh dialogues)
      run_flags: "--privileged --cgroupns=host"
      notes: >
        systemd as PID 1; module 02 family only (manifest lint rejects systemd commands on
        userland). dbus is installed so non-root systemctl reaches PID 1 exactly as on a real
        server. The fictional evidence-collector ships as a REAL .deb baked at /home/grcops and
        is NOT installed at boot — the §6 apt→start→enable flow is captured real. Volatile
        spans (wall-clock timestamps, ago-durations, kernel PIDs, ephemeral ports, key
        fingerprints, the capture container's cgroup id) are normalized to {{hole}} markers at
        capture time via each structured entry's holes[].find regexes; systemd-under-faketime
        was rejected (PID-1 timer instability), so the sim pins module-canon scenario times
        inside those holes (ISC-132). sudo/passwd entries use piped `… | sudo -S` in the
        harness (no tty); the interactive sim equivalent (prompt + typed secret) is declared
        per-entry as sim_equiv and the byte contract is the concatenated streams.
    macos-host:
      script: env/macos-contract.sh
      shell: zsh -f
      user: analyst
      cols: 80


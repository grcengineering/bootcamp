    cwd: /home/analyst
    cmd: "ls -C -w80"
    tty_equiv: "ls"               # what the learner types; tty rendering == this capture
  - id: m01-pwd-after-cd
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst
    pre: ["cd evidence"]

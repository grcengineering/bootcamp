# Reusable hole definitions for booted structured captures (module 02 family): `find` is the
# capture-time scrub regex (matches in captured streams are replaced with {{name}}), `pattern`
# is what the fidelity suite accepts inside that hole, `source` names the entropy (ISC-56).
hole_defs:
  - &h_since { name: since_ts, find: "(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC", pattern: "(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC", source: "capture wall clock — sim pins module-canon scenario times (ISC-132)" }
  - &h_ago { name: ago, find: "; [0-9][^;\\n]{0,24} ago", pattern: "; [0-9][^;\\n]{0,24} ago", source: "capture-relative duration" }
  - &h_jts { name: journal_ts, find: "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ 0-3][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}", pattern: "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ 0-3][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}", source: "capture wall clock — sim renders sim-clock times" }
  - &h_pid { name: pid, find: "\\[[0-9]+\\]", pattern: "\\[[0-9]+\\]", source: "kernel pid allocation — sim pins scenario pids (sshd 742)" }
  - &h_mainpid { name: main_pid, find: "Main PID: [0-9]+", pattern: "Main PID: [0-9]+", source: "kernel pid allocation" }
  - &h_procpid { name: proc_pid, find: "Process: [0-9]+", pattern: "Process: [0-9]+", source: "kernel pid allocation" }
  - &h_tasks { name: tasks, find: "Tasks: [0-9]+ \\(limit: [0-9]+\\)", pattern: "Tasks: [0-9]+ \\(limit: [0-9]+\\)", source: "host cpu/memory limits" }
  - &h_mem { name: memory, find: "Memory: [0-9.]+[KMG] \\(peak: [0-9.]+[KMG]\\)", pattern: "Memory: [0-9.]+[KMG] \\(peak: [0-9.]+[KMG]\\)", source: "runtime memory usage" }
  - &h_cpu { name: cpu, find: "CPU: [0-9.]+m?s", pattern: "CPU: [0-9.]+m?s", source: "runtime cpu usage" }
  - &h_cgroup { name: cgroup_prefix, find: "/docker/[0-9a-f]{64}", pattern: "(?:/docker/[0-9a-f]{64})?", source: "capture container id — absent on the simulated host" }
  - &h_cgpid { name: cgroup_pid, find: "─[0-9]+", pattern: "─[0-9]+", source: "kernel pid allocation" }
  - &h_port { name: port, find: "port [0-9]{4,5}", pattern: "port [0-9]{4,5}", source: "ephemeral client port" }
  - &h_fp { name: fingerprint, find: "SHA256:[A-Za-z0-9+/]{43}", pattern: "SHA256:[A-Za-z0-9+/]{43}", source: "key entropy (sim derives from structured session entropy)" }
  - &h_art { name: randomart, find: "^\\|.{17}\\|$", pattern: "\\|.{17}\\|", source: "key entropy randomart (drunken-bishop over the key hash)" }
  - &h_pspid { name: ps_pid, find: " +[0-9]+ sshd", pattern: " +[0-9]+ sshd", source: "kernel pid allocation (right-aligned column absorbs digit count)" }
  - &h_duration { name: duration, find: "Duration: [0-9.]+(?:ms|s|min)", pattern: "Duration: [0-9.]+(?:ms|s|min)", source: "runtime active-period duration" }
  - &h_clientip { name: client_ip, find: "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}(?= port)|(?<=user [a-z]+ )(?:[0-9]{1,3}\\.){3}[0-9]{1,3}|::1(?= port)|(?<=user [a-z]+ )::1", pattern: "(?:(?:[0-9]{1,3}\\.){3}[0-9]{1,3}|::1)", source: "capture-network client address — sim pins the module-canon workstation address 10.0.0.5 (§4.7)" }
  - &h_lsdate { name: ls_date, find: "[A-Z][a-z]{2} [ 0-3][0-9] [0-9]{2}:[0-9]{2}", pattern: "[A-Z][a-z]{2} [ 0-3][0-9] [0-9]{2}:[0-9]{2}", source: "capture mtime — sim renders sim-clock mtimes" }

entries:
  # ---- module 00 — exercise lab-00 rubric check (the only executable surface the
  # ---- conceptual lab simulates: labs/happy-path.sh evaluate_analysis(), run REAL
  # ---- against the committed seed documents; the web builder port is additionally
  # ---- byte-accepted against web/tests/fixtures/builder-captures.json m00) ----
  - id: m00-evaluate-exemplar
    module: "00"
    source: docker-linux-userland
    match: byte-exact
    seed: m00
    cwd: /home/analyst
    cmd: "evaluate-analysis lab00/legacy-vs-engineered-laptop-encryption.md"
    post: ["echo $?"]
    notes: >
      The module-00 rubric check ACCEPTS the conforming laptop-encryption exemplar
      (canon-locked to labs/setup.sh): silent, exit 0. Grounds exercise lab-00 t7's
      pass verdict.
  - id: m00-evaluate-nonconforming
    module: "00"
    source: docker-linux-userland
    match: byte-exact
    seed: m00
    cwd: /home/analyst
    cmd: "evaluate-analysis lab00/non-conforming.md"
    post: ["echo $?"]
    notes: >
      The legacy-only counterexample (labs/happy-path.sh BAD heredoc) is REJECTED with
      one two-space-indented line per missing element, exit 1 — the discrimination
      assertion the module's own CI makes.
  - id: m00-evaluate-template
    module: "00"
    source: docker-linux-userland
    match: byte-exact
    seed: m00
    cwd: /home/analyst
    cmd: "evaluate-analysis lab00/legacy-vs-engineered-my-control.md"
    post: ["echo $?"]
    notes: >
      The untouched learner template (headings only) is REJECTED with the full missing
      list — grounds exercise lab-00 t1 (watch the check discriminate before writing).

  # ---- module 01 — §5.1 orientation (prose canon transcripts) ----
  - id: m01-pwd-home
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst
    cmd: "pwd"
  - id: m01-ls-home

# Fidelity manifest — the enumeration of every taught command invocation the simulator must
# reproduce, each with its ground-truth source and match class (root ISA ISC-53).
# Captured fixtures land in .ci/fixtures/captured/<id>.json with provenance.
#
# match classes: byte-exact | structured | engine-pinned | synthesized-porcelain |
#                authored-with-citation | computed
# sources: docker-linux-userland | docker-linux-booted | macos-host | pwsh-authored |
#          wasm-engine | authored

meta:
  version: 1
  epoch: "2026-06-01T09:00:00Z"
  contracts:
    docker-linux-userland:
      dockerfile: env/Dockerfile.userland
      base_digest: "sha256:786a8b558f7be160c6c8c4a54f9a57274f3b4fb1491cf65146521ae77ff1dc54"
      hostname: workstation
      user: analyst
      uid: 1000
      home: /home/analyst
      shell: /bin/bash
      locale: C.UTF-8
      cols: 80
      notes: >
        tty-style columnar output is captured via explicit width flags (e.g. `ls -C -w80`),
        which GNU ls renders byte-identically to a tty at that width — no pty needed,
        stderr separation preserved. Plain (TERM=dumb) output: no color codes anywhere.
    docker-linux-booted:
      dockerfile: env/Dockerfile.booted
      base_digest: "sha256:786a8b558f7be160c6c8c4a54f9a57274f3b4fb1491cf65146521ae77ff1dc54"
      hostname: web-01
      user: grcops
      uid: 1001
      home: /home/grcops
      shell: /bin/bash
      locale: C.UTF-8
      cols: 80
      password: labpass         # scenario constant baked into the image (sudo/ssh dialogues)
      run_flags: "--privileged --cgroupns=host"
      notes: >
        systemd as PID 1; module 02 family only (manifest lint rejects systemd commands on
        userland). dbus is installed so non-root systemctl reaches PID 1 exactly as on a real
        server. The fictional evidence-collector ships as a REAL .deb baked at /home/grcops and
        is NOT installed at boot — the §6 apt→start→enable flow is captured real. Volatile
        spans (wall-clock timestamps, ago-durations, kernel PIDs, ephemeral ports, key
        fingerprints, the capture container's cgroup id) are normalized to {{hole}} markers at
        capture time via each structured entry's holes[].find regexes; systemd-under-faketime
        was rejected (PID-1 timer instability), so the sim pins module-canon scenario times
        inside those holes (ISC-132). sudo/passwd entries use piped `… | sudo -S` in the
        harness (no tty); the interactive sim equivalent (prompt + typed secret) is declared
        per-entry as sim_equiv and the byte contract is the concatenated streams.
    macos-host:
      script: env/macos-contract.sh
      shell: zsh -f
      user: analyst
      cols: 80

seeds:
  m01:
    home: seeds/m01/home          # copied to /home/analyst (ownership analyst:analyst)
    path_bin: seeds/m01/bin       # installed to /usr/local/bin (mode 0755)
  m02:
    home: seeds/m02/home          # overlaid onto /home/grcops (committed 411-byte scenario keypair, baked-.deb stand-in)
    path_bin: seeds/m02/bin       # lab tools (lab-setup 02 — canon-locked to modules/02 labs/setup.sh)
    system: seeds/m02/system      # /etc passwd+group+skel+hostname, scenario sshd_config (3243 B), ssh.service unit, apt-installed.txt
    apply: seeds/m02/apply-seed.sh  # root overlay applied in the booted container before each session
    epoch: "2026-05-27T09:45:00Z" # module 02 scenario clock — canon May 27 mtimes render in ls -l recent format
  m04:                            # PowerShell sim (module 04): typed object stores, not a home-dir copy
    object_store: seeds/m04/win-lab04.json
    object_store_noncompliant: seeds/m04/win-lab04-noncompliant.json
    notes: >
      WIN-LAB04 subsystem stores (BitLocker, Defender, registry, Security log, local groups);
      gpresultReportFile fields name the authored RSoP fixtures alongside; loaders strip the
      report file trailing newline when seeding gpresultReport.
  m06:
    home: seeds/m06/home          # ~/lab06/: byte-identical copies of modules/06-api-fundamentals/labs/*
    path_bin: seeds/m06/bin       # no PATH tools — the lab's scripts live in ~/lab06

# Reusable hole definitions for booted structured captures (module 02 family): `find` is the
# capture-time scrub regex (matches in captured streams are replaced with {{name}}), `pattern`
# is what the fidelity suite accepts inside that hole, `source` names the entropy (ISC-56).
hole_defs:
  - &h_since { name: since_ts, find: "(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC", pattern: "(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC", source: "capture wall clock — sim pins module-canon scenario times (ISC-132)" }
  - &h_ago { name: ago, find: "; [0-9][^;\\n]{0,24} ago", pattern: "; [0-9][^;\\n]{0,24} ago", source: "capture-relative duration" }
  - &h_jts { name: journal_ts, find: "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ 0-3][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}", pattern: "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ 0-3][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}", source: "capture wall clock — sim renders sim-clock times" }
  - &h_pid { name: pid, find: "\\[[0-9]+\\]", pattern: "\\[[0-9]+\\]", source: "kernel pid allocation — sim pins scenario pids (sshd 742)" }
  - &h_mainpid { name: main_pid, find: "Main PID: [0-9]+", pattern: "Main PID: [0-9]+", source: "kernel pid allocation" }
  - &h_procpid { name: proc_pid, find: "Process: [0-9]+", pattern: "Process: [0-9]+", source: "kernel pid allocation" }
  - &h_tasks { name: tasks, find: "Tasks: [0-9]+ \\(limit: [0-9]+\\)", pattern: "Tasks: [0-9]+ \\(limit: [0-9]+\\)", source: "host cpu/memory limits" }
  - &h_mem { name: memory, find: "Memory: [0-9.]+[KMG] \\(peak: [0-9.]+[KMG]\\)", pattern: "Memory: [0-9.]+[KMG] \\(peak: [0-9.]+[KMG]\\)", source: "runtime memory usage" }
  - &h_cpu { name: cpu, find: "CPU: [0-9.]+m?s", pattern: "CPU: [0-9.]+m?s", source: "runtime cpu usage" }
  - &h_cgroup { name: cgroup_prefix, find: "/docker/[0-9a-f]{64}", pattern: "(?:/docker/[0-9a-f]{64})?", source: "capture container id — absent on the simulated host" }
  - &h_cgpid { name: cgroup_pid, find: "─[0-9]+", pattern: "─[0-9]+", source: "kernel pid allocation" }
  - &h_port { name: port, find: "port [0-9]{4,5}", pattern: "port [0-9]{4,5}", source: "ephemeral client port" }
  - &h_fp { name: fingerprint, find: "SHA256:[A-Za-z0-9+/]{43}", pattern: "SHA256:[A-Za-z0-9+/]{43}", source: "key entropy (sim derives from structured session entropy)" }
  - &h_art { name: randomart, find: "^\\|.{17}\\|$", pattern: "\\|.{17}\\|", source: "key entropy randomart (drunken-bishop over the key hash)" }
  - &h_pspid { name: ps_pid, find: " +[0-9]+ sshd", pattern: " +[0-9]+ sshd", source: "kernel pid allocation (right-aligned column absorbs digit count)" }
  - &h_duration { name: duration, find: "Duration: [0-9.]+(?:ms|s|min)", pattern: "Duration: [0-9.]+(?:ms|s|min)", source: "runtime active-period duration" }
  - &h_clientip { name: client_ip, find: "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}(?= port)|(?<=user [a-z]+ )(?:[0-9]{1,3}\\.){3}[0-9]{1,3}|::1(?= port)|(?<=user [a-z]+ )::1", pattern: "(?:(?:[0-9]{1,3}\\.){3}[0-9]{1,3}|::1)", source: "capture-network client address — sim pins the module-canon workstation address 10.0.0.5 (§4.7)" }
  - &h_lsdate { name: ls_date, find: "[A-Z][a-z]{2} [ 0-3][0-9] [0-9]{2}:[0-9]{2}", pattern: "[A-Z][a-z]{2} [ 0-3][0-9] [0-9]{2}:[0-9]{2}", source: "capture mtime — sim renders sim-clock mtimes" }

entries:
  # ---- module 01 — §5.1 orientation (prose canon transcripts) ----
  - id: m01-pwd-home
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst
    cmd: "pwd"
  - id: m01-ls-home
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst
    cmd: "ls -C -w80"
    tty_equiv: "ls"               # what the learner types; tty rendering == this capture
  - id: m01-pwd-after-cd
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst
    pre: ["cd evidence"]
    cmd: "pwd"
  - id: m01-cd-nosuch
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst
    cmd: "cd nosuchdir"

  # ---- module 01 — §5.2 streams (fictional tool; stderr line is prose canon) ----
  - id: m01-collect-plain
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01
    cwd: /home/analyst/evidence
    cmd: "collect-encryption-status"
    citation: "module 01 §5.2 (WARN line verbatim; stdout authored fixture)"
  - id: m01-collect-redirect
    module: "01"
    source: docker-linux-userland
    match: byte-exact
    seed: m01

# sscsb: CI secret scanning. Local hooks block first; this catches anything that
# slips past them (e.g. commits made through the GitHub web UI).
#
# TruffleHog is the ONLY credential scanner here, matching `gitleaks = false` in
# .sscsb/config.toml. It verifies a candidate against the issuing provider, so a
# finding means a live credential rather than a high-entropy string. The stock
# sscsb template also ran a Gitleaks job; that job was removed because (a) this
# repo ships deliberately-planted teaching secrets — a throwaway lab SSH key and
# sample JWTs to decode — which a regex-only scanner reports as findings forever,
# training reviewers to ignore a red check, and (b) gitleaks-action requires a
# paid licence for organisation-owned repos like grcengineering/*, so the job
# could not pass here regardless.
#
# Measured, not assumed: TruffleHog reports ZERO findings at
# --results=verified,unknown across this repo's entire git history.
# All actions pinned to full commit SHAs (sscsb actions-audit enforces this).
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (v3.95.9).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown

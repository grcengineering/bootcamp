name: deploy-pages

# MANUAL deploy only (workflow_dispatch) — publishing to bootcamp.grc.engineering is an
# explicit, owner-triggered step. To enable continuous deploy on push, uncomment the `push`
# trigger below (then a push to main that touches web/modules/tracks will auto-publish).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["web/**", "modules/**", "tracks/**"]

# Least privilege: the top level is read-only and `build` inherits only that.
# The Pages write + OIDC grants live on `deploy`, the one job that publishes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for the build steps to read.
          persist-credentials: false
      # Astro 6 requires Node >=22.12; the `astro` bin runs under the runner's system Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install deps
        run: bun install
        working-directory: web
      - name: Build (sync curriculum + astro build)
        run: bun run build
        working-directory: web
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only grants in this workflow that are not read-only, scoped to the only
    # job that publishes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

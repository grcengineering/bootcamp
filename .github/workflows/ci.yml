name: curriculum-ci

# Green CI is the curriculum's evidence. The build status is the assurance artifact.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # nightly-ish weekly sweep (Mon 07:00 UTC) — catches link rot on main

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Anatomy lint (9-section anatomy + meta.yaml)
        run: bun .ci/anatomy-lint.ts
      - name: Originality lint (third-party links quarantined to §8)
        run: bun .ci/originality-lint.ts
      - name: Style lint (measurable Bloom objectives)
        run: bun .ci/style-lint.ts
      - name: Lab reproduction smoke test
        run: bash .ci/lab-repro.sh
      - name: Tooling tests + coverage (95% floor on .ci/lib.ts)
        # Explicit file — `bun test` treats a bare `tests/` as a name FILTER (still recurses into
        # web/tests/, where web deps aren't installed → Cannot find package 'yaml'). The web suite
        # has its own job (simulation-fidelity) with web deps installed.
        run: bun test --coverage ./tests/lib.test.ts
      - name: Exercise spec lint (schema + verifier seam + completability + transcripts)
        run: bun install --frozen-lockfile && cd web && bun install --frozen-lockfile && cd .. && bun .ci/exercise-lint.ts
      - name: Fidelity manifest lint (taxonomy + provenance + citations + loosening tripwire)
        run: bun .ci/fixtures/manifest-lint.ts
      - name: Semantic originality (cross-module; §8-source sweep runs on the scheduled job)
        run: OFFLINE=1 bun .ci/semantic-originality.ts
      - name: Link check (§8 supplemental URLs)
        run: bun .ci/link-check.ts
      - name: Regenerate rot dashboard
        run: bun dashboard/generate.ts

  simulation-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Astro 6 requires Node >=22.12; the `astro` bin runs under the runner's system Node,
      # which is otherwise unpinned. Pin it so `astro build` doesn't fail on an old runner Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root deps (web fidelity tests import .ci/fixtures/load-manifest.ts, which resolves `yaml` from the ROOT node_modules — bun walks up from the importing file's dir, not from web/)
        run: bun install --frozen-lockfile
      - name: Install web deps
        run: cd web && bun install --frozen-lockfile
      - name: Stage engine assets + sync content (public/engines is gitignored — fetch-engines copies the WASM payloads the payload-budget tests assert on)
        run: cd web && bun run sync
      - name: Fidelity suite (simulator vs captured ground truth) + engine + verifier + replay gates
        run: cd web && bun test
      - name: Web build (incl. exercise content sync)
        run: cd web && bun run build

  nightly-originality:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Semantic originality vs live §8 sources (network)
        run: bun .ci/semantic-originality.ts
